<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#10241f" />
  <title>Page not found — Yoav Shlomov</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #17251d; --paper: #f4efe3; --accent: #b25126; --accent-text: #9e4822;
      --teal: #227269; --muted: #61675e; --rule: #d8d0be; --white: #fbf9f2;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; }
    body {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      font-family: "DM Sans", system-ui, sans-serif;
      background: var(--paper);
      color: var(--ink);
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    a:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
    .nav {
      height: 64px;
      display: flex;
      align-items: center;
      padding: 0 clamp(1rem, 4vw, 2.5rem);
      border-bottom: 1px solid var(--rule);
    }
    .nav-logo { font-family: "Playfair Display", Georgia, serif; font-size: 1.1rem; font-weight: 700; }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      max-width: 1120px;
      width: 100%;
      margin: 0 auto;
      padding: clamp(3rem, 8vw, 6rem) clamp(1.5rem, 5vw, 3rem);
    }
    .eyebrow {
      font-size: 0.75rem; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 0.75rem;
    }
    h1 {
      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(2.6rem, 7vw, 5.5rem);
      font-weight: 700;
      line-height: 0.98;
      letter-spacing: -0.02em;
      margin-bottom: 1.25rem;
    }
    h1 em { font-style: italic; font-weight: 400; color: var(--teal); }
    .lede { max-width: 34rem; color: var(--muted); font-size: 1.05rem; margin-bottom: 2.25rem; }
    .lede code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.9em; color: var(--ink); word-break: break-all; }
    .cta {
      display: inline-flex; align-items: center; gap: 0.5rem;
      font-size: 0.8rem; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--accent-text); border-bottom: 1.5px solid var(--accent-text); padding-bottom: 2px;
      transition: opacity 0.2s;
    }
    .cta:hover { opacity: 0.7; }
    .cta::before { content: "←"; }
    .links {
      list-style: none;
      display: flex; flex-wrap: wrap; gap: 0.75rem;
      margin-top: 2.5rem;
    }
    .links a {
      display: inline-block;
      font-size: 0.78rem; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase;
      border: 1.5px solid var(--ink); padding: 0.6rem 1.4rem;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }
    .links a:hover { background: var(--accent); border-color: var(--accent); color: var(--white); }
    footer {
      border-top: 1px solid var(--rule);
      padding: 1.5rem clamp(1.5rem, 5vw, 3rem);
      font-size: 0.75rem; color: var(--muted);
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <header class="nav">
    <a href="/" class="nav-logo">Yoav Shlomov</a>
  </header>

  <main>
    <p class="eyebrow">Error 404</p>
    <h1>Nothing playing <em>here.</em></h1>
    <p class="lede">The page you were looking for doesn't exist or isn't available. It may have moved, or the link might have a typo<span id="path-note"></span>.</p>
    <a href="/" class="cta">Back to the homepage</a>
    <ul class="links" aria-label="Popular pages">
      <li><a href="/#music">Music</a></li>
      <li><a href="/#bio">Bio</a></li>
      <li><a href="/press">Press kit</a></li>
      <li><a href="/#contact">Contact</a></li>
    </ul>
  </main>

  <footer>&copy; <span id="yr">2026</span> Yoav Shlomov</footer>

  <script>
    document.getElementById('yr').textContent = new Date().getFullYear();
    // show the requested path so the visitor can spot a typo (text node — never interpreted as HTML)
    var p = location.pathname;
    if (p && p !== '/' && p.length < 120) {
      var note = document.getElementById('path-note');
      note.appendChild(document.createTextNode(' in '));
      var code = document.createElement('code');
      code.textContent = p;
      note.appendChild(code);
    }
  </script>
</body>
</html>
